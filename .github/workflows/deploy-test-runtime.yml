name: Deploy OSRS Hub Test Combat Runtime (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osrshubtest-combat-runtime-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy the test combat runtime only
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 58cc0c5ee11304ba28f879f354bd899c
    steps:
      - name: Check out combat engine
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run combat engine tests
        run: yarn test
      - name: Deploy isolated OSRS Hub Test combat runtime
        run: yarn wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify test runtime health and catalogues
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://osrshubtest-combat-runtime.prices-app.workers.dev/health
          curl --fail --silent --show-error https://osrshubtest-combat-runtime.prices-app.workers.dev/api/monsters?limit=1
          curl --fail --silent --show-error https://osrshubtest-combat-runtime.prices-app.workers.dev/api/equipment?limit=1
